"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
scan_timeout = 30
command_timeout = 500
palette = "catppuccin_mocha"

format = """
$hostname$directory$git_branch$git_status$nodejs$python$cmd_duration$status
$character"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
style = "bold mauve"
symbol = " "

[git_status]
style = "bold yellow"

[hostname]
style = "bold lavender"
ssh_only = true
format = "[$hostname]($style) "

[cmd_duration]
style = "bold peach"
min_time = 1000
format = "took [$duration]($style) "

[status]
style = "bold red"
disabled = false
symbol = "✘"

[nodejs]
format = 'via [${symbol}${version}]($style) '
style = "bold green"

# Directory first; Python version + venv name at the end of the python segment.
# Leading "(venv)" from `activate` is disabled in .zshrc via VIRTUAL_ENV_DISABLE_PROMPT.
# mise's uv venv auto-activation is reflected in $virtualenv.
[python]
format = 'via [${symbol}${version}( \($virtualenv\))]($style) '
style = "bold green"
